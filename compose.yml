services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    container_name: backend
    environment:
      - PORT=5000

  frontend:
    build: ./client
    ports:
      - "80:5173"
    container_name: frontend
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
