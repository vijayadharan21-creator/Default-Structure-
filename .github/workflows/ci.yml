name: CI
on:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - run : echo "Working"
      - uses : actions/checkout@v4
      - uses : action/setup-node@v4
        with :
          node-version : "24"
          cache : npm
          cache-dependency-path: server/package-lock.json
      - run : npm ci 
        working-directory: client
      - run : npm run build
        working-directory: client

          
        