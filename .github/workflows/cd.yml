name: CD

on:
  workflow_dispatch:            # a manual "Run workflow" button
  workflow_run:
    workflows: ["CI"]           # must match the name: line of your CI file
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # only deploy if CI succeeded (or you started it manually)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            set -e
            if [ -d "/home/ubuntu/Default-Structure-" ]; then
              cd /home/ubuntu/Default-Structure-
            elif [ -d "/home/ubuntu/Default-Structure" ]; then
              cd /home/ubuntu/Default-Structure
            else
              echo "Error: Directory not found in /home/ubuntu"
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main
            echo "Deployed commit: $(git rev-parse --short HEAD)"

            sudo docker compose up -d --build

            echo "Waiting for the backend..."
            for i in $(seq 1 12); do
              if curl -fsS -m 5 http://localhost:5000/api/health; then
                echo
                echo "Healthy."
                sudo docker image prune -f
                exit 0
              fi
              echo "Retrying ($i/12)..."
              sleep 5
            done

            echo "Health check failed. Last backend logs:"
            sudo docker compose logs --tail 50 backend
            exit 1